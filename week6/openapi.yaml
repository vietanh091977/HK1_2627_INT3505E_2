openapi: 3.0.3

info:
  title: Social Network API - Auth & Posts
  version: 1.0.0


servers:
  - url: https://api.example.com/v1

tags:
  - name: Auth
    description: Authentication and token refresh
  - name: Posts
    description: Post management

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: User login
      description: Public endpoint. Authenticates with email/password and returns a token pair. Rate-limited.
      security: []
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              valid:
                summary: Valid credentials
                value:
                  email: an@vnu.edu.vn
                  password: correct horse battery staple
      responses:
        '200':
          description: Login successful
          headers:
            Cache-Control:
              description: Prevent caching of sensitive token responses
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI0MiJ9.signature
                refresh_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXBlIjoicmVmcmVzaCJ9.signature
                token_type: Bearer
                expires_in: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid email or password (generic message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_credentials
                message: Invalid email or password.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh access token
      description: Exchanges a valid refresh token for a new token pair using token rotation.
      security:
        - refreshAuth: []
      x-required-scopes: []
      responses:
        '200':
          description: New token pair issued
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI0MiJ9.newsig
                refresh_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0eXBlIjoicmVmcmVzaCJ9.newsig
                token_type: Bearer
                expires_in: 900
        '401':
          description: Refresh token missing, invalid, expired, or revoked
          headers:
            WWW-Authenticate:
              schema: { type: string, example: 'Bearer error="invalid_token"' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                expired:
                  value: { error: token_expired, message: Refresh token has expired. }
                revoked:
                  value: { error: token_revoked, message: Refresh token has been revoked. }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /posts/{id}:
    get:
      tags: [Posts]
      operationId: getPost
      summary: Get post by ID
      description: Retrieves a post by ID. Requires `posts:read` scope and ownership or visibility authorization.
      x-required-scopes: [posts:read]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1024
      responses:
        '200':
          description: Post retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
              example:
                id: 1024
                author_id: 42
                content: Hello everyone!
                visibility: public
                created_at: '2026-10-20T08:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing `posts:read` scope or unauthorized object access (BOLA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficient_scope:
                  summary: Missing scope
                  value:
                    error: insufficient_scope
                    message: Token lacks the required scope.
                    need_all_of: [posts:read]
                not_allowed:
                  summary: Access denied
                  value:
                    error: forbidden
                    message: You are not authorized to view this post.
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found
                message: Post not found.
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (RS256, 15-min TTL). Scopes passed in `scopes` claim.
    refreshAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Revocable refresh token (30-day TTL). For `POST /auth/refresh` only.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: an@vnu.edu.vn
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 128
          description: User plaintext password. Never logged or returned.

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token.
        refresh_token:
          type: string
          description: Rotated JWT refresh token.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 900

    Post:
      type: object
      description: Post entity serialized via DTO (excludes internal/sensitive fields).
      required: [id, author_id, content, visibility, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1024
        author_id:
          type: integer
          format: int64
          example: 42
        content:
          type: string
          maxLength: 5000
        visibility:
          type: string
          enum: [public, friends, private]
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
          example: invalid_token
        message:
          type: string
          description: Human-readable error message without sensitive details.
        need_all_of:
          type: array
          description: Missing scopes (returned only on `insufficient_scope`).
          items:
            type: string

  responses:
    BadRequest:
      description: Malformed syntax or invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: Invalid request parameters.

    Unauthorized:
      description: Missing, invalid, expired, or revoked token
      headers:
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer error="invalid_token"' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value: { error: missing_token, message: Access token is missing. }
            expired:
              value: { error: token_expired, message: Access token has expired. }
            invalid:
              value: { error: invalid_token, message: Access token is invalid. }

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Cooldown wait time in seconds
          schema: { type: integer, example: 60 }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limited
            message: Too many requests. Please try again later.