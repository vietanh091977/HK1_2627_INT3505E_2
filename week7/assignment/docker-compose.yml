services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-products}
      POSTGRES_USER: ${POSTGRES_USER:-products}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-products-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    environment:
      APP_CONFIG: production
      SECRET_KEY: ${SECRET_KEY:-local-compose-secret-change-me}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-products}:${POSTGRES_PASSWORD:-products-local}@db:5432/${POSTGRES_DB:-products}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["sh", "-c", "flask db upgrade && exec gunicorn --bind=0.0.0.0:5000 --workers=2 --access-logfile=- wsgi:app"]
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
